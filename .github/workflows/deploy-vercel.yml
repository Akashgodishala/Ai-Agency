name: Deploy to Vercel

# Deploys the platform to Vercel on every push to the working branch.
#
# CREDENTIALS: GitHub Actions secrets, and nothing else.
#   Settings → Secrets and variables → Actions
#     VERCEL_TOKEN      (required)
#     ANTHROPIC_API_KEY (optional — only needed to seed the Vercel project env
#                        var on a fresh project; the key normally already lives
#                        there, which is where it belongs)
#
# Secrets are referenced directly on the step that needs them and are never
# copied into $GITHUB_ENV, written to a file, echoed, or read back out of any
# repository surface. Values that arrive via `secrets.*` are masked in logs by
# GitHub automatically; a value staged through $GITHUB_ENV or supplied as a
# workflow input is not covered by that guarantee, which is why neither is used.

on:
  push:
    branches: [claude/ai-agency-planning-07d0h3]
    paths:
      - "app/**"
      - ".github/workflows/deploy-vercel.yml"
  # Manual re-run button. Deliberately takes NO inputs: workflow_dispatch input
  # values are recorded in the run's metadata and shown in the Actions UI to
  # anyone who can read the repository, so they are not a safe way to pass a
  # token — least of all once this repository is public.
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

# Least privilege: the job only reads the checked-out code. It has no reason to
# read issues, and must not be able to write anything back to the repository.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Vercel team identifier — an account identifier, not a credential.
      SCOPE: team_BXI4zZuyfGKt6CVFn6rGaTCS
    steps:
      - uses: actions/checkout@v4

      # Fail fast and loudly when the token is missing.
      #
      # This tests only whether the secret is non-empty — it never prints,
      # stores, or forwards the value. An earlier version of this pipeline fell
      # back to other credential sources and, when those were empty too, skipped
      # every remaining step and still reported a green checkmark: two passes of
      # work shipped nothing while the run showed success. A deploy that reports
      # success without deploying is worse than one that breaks, so this exits
      # non-zero instead.
      - name: Check deploy credentials are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing repository secret VERCEL_TOKEN."
            echo "::error::Add it at Settings → Secrets and variables → Actions →"
            echo "::error::New repository secret, named exactly VERCEL_TOKEN."
            echo "::error::Refusing to report a successful deploy without deploying."
            exit 1
          fi
          echo "VERCEL_TOKEN is present."

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link project
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel link --yes --project agentmint --scope "$SCOPE" --token "$VERCEL_TOKEN"

      # Optional. The Anthropic key normally already lives in the Vercel
      # project's environment variables; this step only exists to seed it on a
      # fresh project. Skipped when the secret is absent, and never fatal.
      # The presence check lives in the shell rather than in an `if:`
      # expression: GitHub documents the `secrets` context as usable "only at
      # certain places within a job", and a conditional that silently evaluates
      # to false would skip this step without saying so. Inside the shell the
      # variable is unambiguously available, and the skip is announced.
      - name: Seed ANTHROPIC_API_KEY on the Vercel project
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret set — skipping."
            echo "(Expected: the key already lives in the Vercel project's env vars.)"
            exit 0
          fi
          printf '%s' "$ANTHROPIC_API_KEY" \
            | vercel env add ANTHROPIC_API_KEY production --token "$VERCEL_TOKEN" \
            || echo "(production value already set — keeping it)"
          printf '%s' "$ANTHROPIC_API_KEY" \
            | vercel env add ANTHROPIC_API_KEY preview --token "$VERCEL_TOKEN" \
            || echo "(preview value already set — keeping it)"

      - name: Make the draft publicly viewable
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Vercel gates new projects behind a login wall by default, so the
          # draft link would 302 to a sign-in page for anyone but the owner.
          # Turning it off makes the URL work for anyone who has it (unlisted,
          # not indexed). Re-enable any time in Project → Settings → Deployment
          # Protection.
          #
          # The token reaches curl through a config on STDIN (`-K -`), so it is
          # never an argv flag (visible in the runner's process list) and never
          # touches disk. /tmp/protection.json holds only the API's response,
          # which contains no credential.
          printf 'header = "Authorization: Bearer %s"\n' "$VERCEL_TOKEN" \
          | curl -sS -K - -X PATCH \
            "https://api.vercel.com/v9/projects/agentmint?teamId=$SCOPE" \
            -H "Content-Type: application/json" \
            -d '{"ssoProtection": null, "passwordProtection": null}' \
            -o /tmp/protection.json -w 'protection update HTTP: %{http_code}\n'
          python3 -c "import json;d=json.load(open('/tmp/protection.json'));print('ssoProtection now:', d.get('ssoProtection'))" || true

      - name: Deploy
        id: deploy
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      # The smoke test must PROVE the new code is what's being served, not just
      # that something answers. Each assertion exits non-zero on failure.
      # It uses no credentials — every request below is one any visitor could make.
      - name: Smoke test
        run: |
          sleep 10
          SHORT="https://agentmint-olive.vercel.app"
          HTML=$(curl -s "$SHORT/")

          echo "== engine status (expect live) =="
          curl -s "$SHORT/api/status"; echo

          echo -n "short link HTTP (expect 200): "
          curl -s -o /dev/null -w '%{http_code}\n' "$SHORT/"

          echo "== proving the deployed markup is current =="
          for phrase in "Describe the work" "Mint the agent" "Agent worlds" "Assay marks" "One sentence"; do
            if echo "$HTML" | grep -qi "$phrase"; then
              echo "  ✓ found: $phrase"
            else
              echo "::error::Deployed page is missing \"$phrase\" — the live site is NOT running this commit."
              exit 1
            fi
          done

          echo -n "gallery renders the catalogue: "
          echo "$HTML" | grep -c 'AI Fraud Detector\|AI Gift Recommender\|AI Contract Reviewer'

          echo "== live chat end-to-end =="
          CFG='{"config":{"id":"smoke01","name":"Smoke Agent","emoji":"🧪","tagline":"test","persona":"You are a concise test agent for a liquor store.","greeting":"hi","suggestedQuestions":[],"knowledge":"Hours: Mon-Sat 10am-9pm.\nPickup orders ready in 30 minutes.","guardrails":[],"captureRules":{"enabled":false,"fields":[],"trigger":""},"createdFrom":"custom","createdAt":"2026-01-01"},"messages":[{"role":"user","content":"what time do you close on saturday?"}]}'
          curl -s -X POST "$SHORT/api/chat" -H 'Content-Type: application/json' -d "$CFG"; echo
