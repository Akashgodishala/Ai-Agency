<!DOCTYPE html>
<!--
  ============================================================================
  AI FRONT DESK — INTERACTIVE DEMO
  ============================================================================
  This is a SALES DEMO. It runs a scripted "intent-matching" conversation so it
  works offline with no API keys — perfect for showing prospects on your phone
  or laptop. The PRODUCTION agent you sell uses a live LLM (Claude) and connects
  to the client's real calendar/CRM; this demo mimics that experience.

  The clinic "Brightline Dental Studio" is FICTIONAL (a stand-in you can rebrand
  per prospect). To reskin for a live demo tailored to a real prospect, edit the
  CLINIC object and the KNOWLEDGE / INTENTS arrays below.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Front Desk — Live Demo (Brightline Dental)</title>
<style>
  :root{
    --ground:#F3F5F3; --surface:#FFFFFF; --surface-2:#ECF0ED;
    --ink:#0C1C18; --muted:#5A6B65; --line:#DBE2DE;
    --primary:#0F6E57; --primary-deep:#0A4A3B; --primary-soft:#E3EFEA;
    --accent:#E9A23B; --accent-soft:#F7E9CF; --good:#0F6E57;
    --serif:"Iowan Old Style","Palatino Linotype","URW Palladio L",P052,Palatino,"Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(12,28,24,.05), 0 18px 44px -20px rgba(12,28,24,.30);
  }
  @media (prefers-color-scheme: dark){
    :root{ --ground:#0A1512; --surface:#10201B; --surface-2:#16281F; --ink:#EAF0EC;
      --muted:#95A8A0; --line:#22342C; --primary:#35C99E; --primary-deep:#2AA983;
      --primary-soft:#15352B; --accent:#F0B45C; --accent-soft:#33291A; --good:#35C99E;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 22px 50px -22px rgba(0,0,0,.65); }
  }
  :root[data-theme="light"]{ --ground:#F3F5F3; --surface:#FFFFFF; --surface-2:#ECF0ED; --ink:#0C1C18;
    --muted:#5A6B65; --line:#DBE2DE; --primary:#0F6E57; --primary-deep:#0A4A3B; --primary-soft:#E3EFEA;
    --accent:#E9A23B; --accent-soft:#F7E9CF; --good:#0F6E57; }
  :root[data-theme="dark"]{ --ground:#0A1512; --surface:#10201B; --surface-2:#16281F; --ink:#EAF0EC;
    --muted:#95A8A0; --line:#22342C; --primary:#35C99E; --primary-deep:#2AA983; --primary-soft:#15352B;
    --accent:#F0B45C; --accent-soft:#33291A; --good:#35C99E; }

  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px; gap:16px}
  .demo-badge{font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); display:flex; align-items:center; gap:.6em}
  .demo-badge b{color:var(--accent)}

  .device{width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line);
    border-radius:24px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
    height:min(680px, 82vh)}
  .head{padding:16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; background:var(--surface-2)}
  .avatar{width:42px; height:42px; border-radius:12px; background:var(--primary); color:#fff; display:grid; place-items:center; font-family:var(--serif); font-weight:600; font-size:1.1rem; flex:none}
  .head .meta{display:flex; flex-direction:column; line-height:1.2}
  .head .meta .name{font-family:var(--serif); font-weight:600; font-size:1.05rem}
  .head .meta .sub{font-size:.74rem; color:var(--good); display:flex; align-items:center; gap:.4em; font-family:var(--mono); letter-spacing:.04em}
  .head .meta .sub .blip{width:7px; height:7px; border-radius:50%; background:var(--good); animation:blip 1.8s infinite}
  @keyframes blip{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .theme-toggle{margin-left:auto; background:transparent; border:1px solid var(--line); color:var(--muted); width:34px; height:34px; border-radius:9px; cursor:pointer}
  .theme-toggle:hover{color:var(--ink)}

  .stream{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth}
  .row{display:flex; flex-direction:column; max-width:86%}
  .row.them{align-self:flex-start; align-items:flex-start}
  .row.us{align-self:flex-end; align-items:flex-end}
  .bubble{padding:11px 14px; border-radius:16px; font-size:.96rem; line-height:1.5}
  .them .bubble{background:var(--surface-2); border:1px solid var(--line); border-bottom-left-radius:5px}
  .us .bubble{background:var(--primary); color:#fff; border-bottom-right-radius:5px}
  .stamp{font-size:.64rem; color:var(--muted); font-family:var(--mono); letter-spacing:.05em; margin:4px 4px 0}
  .booked{align-self:center; background:var(--accent-soft); border:1px dashed var(--accent); color:var(--ink);
    border-radius:12px; padding:12px 14px; font-size:.9rem; max-width:92%; display:flex; gap:.6em; align-items:flex-start}
  .typing .bubble{display:flex; gap:5px; align-items:center; padding:14px}
  .typing span{width:7px; height:7px; border-radius:50%; background:var(--muted); opacity:.5; animation:bounce 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.15s} .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:.9}}

  .chips{display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 6px}
  .chip{border:1px solid var(--line); background:var(--surface); color:var(--primary); font-family:var(--sans);
    font-size:.83rem; font-weight:600; padding:7px 12px; border-radius:999px; cursor:pointer; transition:.15s}
  .chip:hover{background:var(--primary-soft); border-color:var(--primary)}

  .composer{display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line); background:var(--surface)}
  .composer input{flex:1; border:1px solid var(--line); background:var(--ground); color:var(--ink);
    border-radius:999px; padding:11px 16px; font-size:.95rem; font-family:var(--sans); outline:none}
  .composer input:focus{border-color:var(--primary)}
  .send{width:44px; height:44px; border-radius:50%; border:none; background:var(--primary); color:#fff; cursor:pointer; flex:none; display:grid; place-items:center}
  .send:hover{background:var(--primary-deep)}

  .foot{font-size:.78rem; color:var(--muted); text-align:center; max-width:440px}
  .foot a{color:var(--primary)}
  @media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>
  <div class="demo-badge"><b>●</b> LIVE DEMO · scripted for offline use · production uses live AI</div>

  <div class="device">
    <div class="head">
      <div class="avatar">B</div>
      <div class="meta">
        <span class="name">Brightline Dental Studio</span>
        <span class="sub"><span class="blip"></span>AI Front Desk · replies instantly</span>
      </div>
      <button class="theme-toggle" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">◐</button>
    </div>

    <div class="stream" id="stream" aria-live="polite"></div>

    <div class="chips" id="chips"></div>

    <form class="composer" id="form" autocomplete="off">
      <input id="input" placeholder="Type a message…" aria-label="Message">
      <button class="send" type="submit" aria-label="Send">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
      </button>
    </form>
  </div>

  <p class="foot">This is a demonstration of an <b>AI Front Desk</b> agent. In production it connects to the clinic's real calendar, CRM, and phone/SMS. Built by your AI agency.</p>

<script>
  const root=document.documentElement;
  document.getElementById('themeBtn').addEventListener('click',()=>{
    const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    root.setAttribute('data-theme',cur==='dark'?'light':'dark');
  });

  // ---- Clinic knowledge (edit to rebrand the demo) ----
  const CLINIC={ name:"Brightline Dental Studio", hours:"Mon–Fri 8am–5pm, Sat 9am–1pm",
    address:"142 Maple Ave, Suite 3", parking:"free lot behind the building",
    insurers:"Delta Dental, Cigna, MetLife, Aetna and most PPO plans",
    newPatientExam:"$79 (exam, cleaning & X-rays for new patients)",
    slots:["Thursday 10:20am","Friday 2:40pm","Monday 9:00am"] };

  // ---- Intent matching (keyword → reply). First match wins. ----
  const INTENTS=[
    {k:['hour','open','close','time','today','sunday','weekend'], r:()=>`We're open <b>${CLINIC.hours}</b> (closed Sundays). Want me to find you an appointment time?`, chips:['Book an appointment','Do you take my insurance?']},
    {k:['insur','delta','cigna','aetna','metlife','ppo','cover','plan'], r:()=>`Good news — we're in-network with <b>${CLINIC.insurers}</b>. I can check your specific plan when you come in. Shall I get you booked?`, chips:['Yes, book me in','How much is a first visit?']},
    {k:['price','cost','how much','fee','exam','cleaning','first visit','new patient'], r:()=>`Our new-patient special is <b>${CLINIC.newPatientExam}</b>. After that, most visits are covered by insurance. Would you like the next available slot?`, chips:['Book the new-patient visit','What are your hours?']},
    {k:['where','address','location','park','directions'], r:()=>`We're at <b>${CLINIC.address}</b>, with ${CLINIC.parking}. Easy to find! Want me to book you a time to come in?`, chips:['Book an appointment']},
    {k:['emergency','pain','hurts','broke','swollen','urgent','bleeding'], r:()=>`I'm sorry you're in pain — let's get you seen quickly. I'm flagging this as urgent and a team member will call you within minutes. If it's severe bleeding or swelling affecting breathing, please call 911. Can I grab your name and number?`, chips:['My name & number','It can wait — just book me'], escalate:true},
    {k:['book','appoint','schedule','slot','availab','come in','get in','visit'], r:()=>`Happy to help! Here's what's open this week:<br>• <b>${CLINIC.slots[0]}</b><br>• <b>${CLINIC.slots[1]}</b><br>• <b>${CLINIC.slots[2]}</b><br>Which works best?`, chips:CLINIC.slots},
    {k:['thursday','friday','monday','tuesday','wednesday','10:20','2:40','9:00','9am','works','that one','first'], r:(t)=>{const slot=CLINIC.slots.find(s=>t.toLowerCase().includes(s.split(' ')[0].toLowerCase()))||CLINIC.slots[0]; return {book:`Appointment confirmed — <b>${slot}</b>`, msg:`Perfect. I've booked you for <b>${slot}</b>. You'll get a text reminder the day before, and a new-patient form by email. Anything else I can help with?`};}, chips:['That\'s all, thanks!','Do you offer whitening?']},
    {k:['whiten','cosmetic','veneer','invisalign','braces','implant'], r:()=>`Yes! We offer whitening, Invisalign, veneers and implants. The dentist can build a plan at your first visit. Want me to book a consultation?`, chips:['Book a consultation','What are your hours?']},
    {k:['human','person','call me','representative','speak','manager'], r:()=>`Of course — I'll have a team member reach out shortly. What's the best name and number to reach you?`, chips:['Give name & number'], escalate:true},
    {k:['thank','thanks','great','perfect','bye','that\'s all','no'], r:()=>`You're all set — we can't wait to see you at ${CLINIC.name}! 😊 Have a great day.`, chips:[]},
    {k:['name','number','phone','call','email','reach'], r:()=>`Got it — thank you! Someone from our team will follow up shortly. Is there anything else I can help with in the meantime?`, chips:['Book an appointment','What are your hours?']}
  ];
  const FALLBACK={ r:()=>`Great question! I'll make sure the team gives you an exact answer. In the meantime, I can help with hours, insurance, pricing, or booking a visit — what would you like?`, chips:['Book an appointment','Do you take my insurance?','What are your hours?'] };

  const stream=document.getElementById('stream'), chipsBox=document.getElementById('chips');
  const form=document.getElementById('form'), input=document.getElementById('input');
  const now=()=>{ // demo timestamp without Date() dependency issues in some sandboxes
    try{return new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}catch(e){return 'now';}
  };

  function addUser(text){
    const row=document.createElement('div'); row.className='row us';
    row.innerHTML=`<div class="bubble"></div><div class="stamp">You · ${now()}</div>`;
    row.querySelector('.bubble').textContent=text; stream.appendChild(row); scroll();
  }
  function addBot(html){
    const row=document.createElement('div'); row.className='row them';
    row.innerHTML=`<div class="bubble">${html}</div><div class="stamp">Front Desk · ${now()}</div>`;
    stream.appendChild(row); scroll();
  }
  function addBooked(html){
    const el=document.createElement('div'); el.className='booked';
    el.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;color:var(--accent)"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg><span>${html}<br><small style="color:var(--muted)">Logged to calendar &amp; CRM · reminder scheduled</small></span>`;
    stream.appendChild(el); scroll();
  }
  function typing(){ const t=document.createElement('div'); t.className='row them typing'; t.id='typing';
    t.innerHTML='<div class="bubble"><span></span><span></span><span></span></div>'; stream.appendChild(t); scroll(); }
  function stopTyping(){ const t=document.getElementById('typing'); if(t)t.remove(); }
  function scroll(){ stream.scrollTop=stream.scrollHeight; }

  function renderChips(list){
    chipsBox.innerHTML='';
    (list||[]).forEach(txt=>{ const c=document.createElement('button'); c.className='chip'; c.type='button';
      c.textContent=txt; c.onclick=()=>handle(txt); chipsBox.appendChild(c); });
  }

  function match(text){
    const t=text.toLowerCase();
    for(const it of INTENTS){ if(it.k.some(w=>t.includes(w))) return it; }
    return FALLBACK;
  }

  function handle(text){
    addUser(text); renderChips([]); typing();
    const it=match(text);
    const delay=650+Math.min(text.length*8,600);
    setTimeout(()=>{
      stopTyping();
      const out=it.r(text);
      if(typeof out==='object' && out.book){ addBot(out.msg); addBooked(out.book); }
      else{ addBot(out); }
      renderChips(it.chips!==undefined?it.chips:FALLBACK.chips);
    }, delay);
  }

  form.addEventListener('submit',e=>{ e.preventDefault(); const v=input.value.trim(); if(!v)return; input.value=''; handle(v); });

  // Opening message
  setTimeout(()=>{ typing(); setTimeout(()=>{ stopTyping();
    addBot(`Hi! 👋 Thanks for reaching out to <b>${CLINIC.name}</b>. I'm the front desk assistant — I can answer questions and book you in 24/7. How can I help?`);
    renderChips(['Book an appointment','Do you take my insurance?','How much is a first visit?','I have a dental emergency']);
  },700); }, 400);
</script>
</body>
</html>
